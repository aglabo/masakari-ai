pre-commit:
  parallel: true
  commands:
    betterleaks:
      run: betterleaks protect --config ./configs/betterleaks.toml --staged

    secretlint:
      glob: "**/*"
      run: >
        secretlint
        --secretlintrc ./configs/secretlint.config.yaml
        --secretlintignore .gitignore
        --maskSecrets
        "{staged_files}"
      skip:
        - empty

prepare-commit-msg:
  commands:
    prepare-commit-message:
      run: bash -c './scripts/prepare-commit-msg.sh --model sonnet --output "{1}"'

# Check commit message against Conventional Commits
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: commitlint --config ./configs/commitlint.config.mjs --edit
